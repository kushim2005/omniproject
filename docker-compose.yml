version: "3.9"

services:
  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.3
    container_name: omnibrain_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OmniBrain FastAPI Backend ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnibrain_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      qdrant:
        condition: service_healthy

  # ── OmniBrain Streamlit UI ──────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: omnibrain_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads  # Share uploads so UI can render images directly
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  qdrant_storage:
    driver: local
